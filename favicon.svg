<?xml version="1.0" encoding="UTF-8"?>
<svg width="32px" height="32px" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>zkMaze Logo</title>
  <g fill="none" stroke="none">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="#0F0F12"/>
    
    <!-- Maze Lines -->
    <path d="M4,4 L4,28 L28,28 L28,4 L4,4 Z" stroke="#FF00FF" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M10,10 L22,10 M10,16 L16,16 L16,22 M22,16 L22,22" stroke="#00FFFF" stroke-width="2" stroke-opacity="0.8"/>
    
    <!-- Start and End Points -->
    <circle cx="8" cy="8" r="3" fill="#00FF7F"/>
    <circle cx="24" cy="14" r="3" fill="#00FFFF"/>
    
    <!-- Player -->
    <circle cx="16" cy="16" r="2" fill="#00FFFF"/>
    
    <!-- Glow Effect -->
    <rect x="0" y="0" width="32" height="32" rx="4" stroke="#FF00FF" stroke-width="1" filter="drop-shadow(0 0 3px #FF00FF)"/>
  </g>
</svg>